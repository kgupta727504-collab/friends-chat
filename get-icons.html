<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#0f172a;color:#fff">
  <h2>Download Real PNG Icons</h2>
  <button onclick="dl(192)" style="padding:16px 24px;font-size:18px;margin:10px;border-radius:12px;background:#10b981;border:none;font-weight:bold">1. Download icon-192.png</button><br>
  <button onclick="dl(512)" style="padding:16px 24px;font-size:18px;margin:10px;border-radius:12px;background:#10b981;border:none;font-weight:bold">2. Download icon-512.png</button>
  <script>
    function dl(s) {
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const x = c.getContext("2d");
      x.fillStyle = "#10b981";
      x.fillRect(0, 0, s, s);
      x.fillStyle = "#020617";
      x.beginPath();
      x.roundRect(s*0.22, s*0.22, s*0.56, s*0.46, s*0.1);
      x.fill();
      x.beginPath();
      x.moveTo(s*0.30, s*0.66);
      x.lineTo(s*0.25, s*0.80);
      x.lineTo(s*0.44, s*0.66);
      x.fill();
      x.fillStyle = "#10b981";
      [0.38, 0.50, 0.62].forEach(p => {
        x.beginPath();
        x.arc(s*p, s*0.45, s*0.035, 0, Math.PI*2);
        x.fill();
      });
      const a = document.createElement("a");
      a.download = "icon-" + s + ".png";
      a.href = c.toDataURL("image/png");
      a.click();
    }
  </script>
</body>
</html>
